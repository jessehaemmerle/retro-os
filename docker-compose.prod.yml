version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: retroos-mongodb-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: retroos
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - retroos-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    container_name: retroos-backend-prod
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: retroos
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    expose:
      - "8001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - retroos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        REACT_APP_BACKEND_URL: http://localhost/api
    container_name: retroos-frontend-prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - retroos-network

  nginx:
    image: nginx:alpine
    container_name: retroos-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - retroos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  mongodb_data:
    driver: local

networks:
  retroos-network:
    driver: bridge
version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: retroos-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: retroos
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - retroos-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: retroos-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: retroos
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    networks:
      - retroos-network
    volumes:
      - ./backend:/app
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
    container_name: retroos-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - retroos-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm start

  nginx:
    image: nginx:alpine
    container_name: retroos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - retroos-network

volumes:
  mongodb_data:

networks:
  retroos-network:
    driver: bridge
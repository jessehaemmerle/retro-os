# Limine-Konfiguration fuer RetroOS
timeout: 0
verbose: no

/RetroOS
    protocol: limine
    path: boot():/boot/retroos.elf

    # Die beiden Bootloader-Dateien werden mitgeladen, damit das
    # Installationsprogramm sie auf die Festplatte schreiben kann.
    module_path: boot():/EFI/BOOT/BOOTX64.EFI
    module_path: boot():/boot/limine-bios.sys

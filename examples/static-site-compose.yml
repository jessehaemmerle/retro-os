# Example: Static Site (Hugo/Jekyll/Gatsby) with Traefik
# Deploy with: docker-compose -f static-site-compose.yml up -d

version: '3.8'

services:
  static-site:
    image: nginx:alpine
    container_name: portfolio-site
    restart: unless-stopped
    volumes:
      - ./site-content:/usr/share/nginx/html:ro
      - ./nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik-global
    labels:
      # Enable Traefik
      - traefik.enable=true
      - traefik.docker.network=traefik-global
      
      # Site routing
      - traefik.http.routers.portfolio.rule=Host(`${SITE_DOMAIN:-portfolio.example.com}`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls.certresolver=letsencrypt
      - traefik.http.services.portfolio.loadbalancer.server.port=80
      
      # Optional: Redirect www to non-www
      # - traefik.http.routers.portfolio-www.rule=Host(`www.${SITE_DOMAIN:-portfolio.example.com}`)
      # - traefik.http.routers.portfolio-www.entrypoints=websecure
      # - traefik.http.routers.portfolio-www.tls.certresolver=letsencrypt
      # - traefik.http.routers.portfolio-www.middlewares=redirect-www
      # - traefik.http.middlewares.redirect-www.redirectregex.regex=^https://www\.(.*)
      # - traefik.http.middlewares.redirect-www.redirectregex.replacement=https://$${1}
      
      # Caching for static assets
      # - traefik.http.routers.portfolio.middlewares=portfolio-cache
      # - traefik.http.middlewares.portfolio-cache.headers.customrequestheaders.Cache-Control=public, max-age=31536000

networks:
  traefik-global:
    external: true
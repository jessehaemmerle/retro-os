# Example: WordPress Blog with Traefik
# Deploy with: docker-compose -f wordpress-compose.yml up -d

version: '3.8'

services:
  wordpress:
    image: wordpress:latest
    container_name: blog-wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: blog-mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-secure_password_change_me}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress-config:/var/www/html/wp-content/uploads
    networks:
      - blog-internal
      - traefik-global
    labels:
      # Enable Traefik
      - traefik.enable=true
      - traefik.docker.network=traefik-global
      
      # Main blog routing
      - traefik.http.routers.blog.rule=Host(`${BLOG_DOMAIN:-blog.example.com}`)
      - traefik.http.routers.blog.entrypoints=websecure
      - traefik.http.routers.blog.tls.certresolver=letsencrypt
      - traefik.http.services.blog.loadbalancer.server.port=80
      
      # Optional: Admin area with basic auth
      # - traefik.http.routers.blog-admin.rule=Host(`${BLOG_DOMAIN:-blog.example.com}`) && PathPrefix(`/wp-admin`)
      # - traefik.http.routers.blog-admin.middlewares=blog-auth
      # - traefik.http.middlewares.blog-auth.basicauth.users=admin:$$2y$$10$$HASHED_PASSWORD

  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_password_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blog-internal
    # Security: MySQL not exposed externally

volumes:
  wordpress_data:
  mysql_data:

networks:
  blog-internal:
    driver: bridge
  traefik-global:
    external: true
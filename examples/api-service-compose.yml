# Example: Simple API Service with Traefik
# Deploy with: docker-compose -f api-service-compose.yml up -d

version: '3.8'

services:
  api:
    image: node:18-alpine
    container_name: api-service
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-sqlite:///app/data/api.db}
    volumes:
      - ./api-code:/app
      - api_data:/app/data
    networks:
      - traefik-global
    labels:
      # Enable Traefik
      - traefik.enable=true
      - traefik.docker.network=traefik-global
      
      # API routing
      - traefik.http.routers.api.rule=Host(`${API_DOMAIN:-api.example.com}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=3000
    command: ["npm", "start"]

volumes:
  api_data:

networks:
  traefik-global:
    external: true